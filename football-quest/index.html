<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1430" />
  <meta name="description" content="Football Quest — استكشف الساحة، اجمع قطع كروية أصلية، وتحدّى نفسك." />
  <title>Football Quest | مغامرة الكورة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div id="arena" class="arena"></div>
    <div id="hud" class="hud" hidden></div>
    <div id="banner" class="banner" hidden role="alert"></div>
    <main id="screen-layer" class="screen-layer" hidden></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="التنقل الرئيسي"></nav>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
  <div id="loading" class="loading" role="status">
    <div class="loading-ball" aria-hidden="true">⚽</div>
    <h1 class="loading-title">Football Quest</h1>
    <p class="loading-text">نجهّز الملعب…</p>
    <noscript><p>اللعبة تحتاج تفعيل JavaScript.</p></noscript>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
