// مكتبة Android صغيرة للمنصة: قراءة موقع وحدة (Foreground — ARCHITECTURE §2: FusedLocationProvider.getCurrentLocation
// بدقة عالية مع علامة الموقع الوهمي)، وتخزين آمن لرموز القسائم (DATA_CONTRACTS §5: Keystore).
// Unity يضمّ مجلدات .androidlib كوحدات Gradle.
apply plugin: 'com.android.library'

android {
    namespace 'com.usersx.footballquest.platform'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.security:security-crypto:1.0.0'
}
