<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>USERS-X Trailer</title>
<style>
@font-face{font-family:Kufam;font-weight:800;src:url(../assets/fonts/kufam-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Kufam;font-weight:800;src:url(../assets/fonts/kufam-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:Plex;font-weight:500;src:url(../assets/fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format('woff2')}
@font-face{font-family:SpaceMono;font-weight:400;src:url(../assets/fonts/space-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:SpaceMono;font-weight:700;src:url(../assets/fonts/space-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Blaka;font-weight:400;src:url(../assets/fonts/blaka-arabic-400-normal.woff2) format('woff2')}

</style>
</head>
<body>
<div id="stage"><canvas id="gl" width="1920" height="1080"></canvas><canvas id="ov" width="1920" height="1080"></canvas></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

// ---------- constants ----------
const W = 1920, H = 1080, DUR = 45;
const C = { bone:'#F4F4F1', void:'#0B0B0F', cyan:'#00DEE6', mag:'#F54BF7', shade:'#33354C' };
const GRID = ['WWW.........WWW','WWWW.......WWWW','WWDDW.....WDDWW','.WDWWW...WWWDW.','..WWWWW.WWWWW..','...WWWWWWWWW...','....WWWMWWW....','.....WMMMW.....','....WWWMWWW....','...WWWWWWWWW...','..WWWWW.WWWWW..','.WDWWW...WWWDW.','WWDDW.....WDDWW','WWWW.......WWWW','WWW.........WWW'];
const CELLS = [];
GRID.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '.') CELLS.push({ r, c, ch }); }));
// quadrant of each cell (for stepped arm shifts); centre plus = 'm'
CELLS.forEach(o => {
  const dx = o.c - 7, dy = o.r - 7;
  if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) o.q = 'm';
  else o.q = (dy < 0 ? 't' : 'b') + (dx < 0 ? 'l' : 'r');
});

// timeline (seconds) — the audio script uses the same numbers
const T = {
  s2: 5, gate: 7.5, s3: 12, worlds: [12, 14.5, 17, 19.5], s4: 22, vortex: 27, collapse: 30.5, flash: 31.6, s5: 32,
  build: 32.8, front: 35.5, flat: 35.6, word: 36.4, s6: 38, line2: 40.5, lock: 42.6, end: 45
};

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const stepq = (x, n) => Math.floor(x * n) / n; // quantised (pixel-step) motion
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (n) => rng(n * 9973 + 17)();

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.void);
scene.fog = new THREE.FogExp2(0x0B0B0F, 0.018);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 600);

const amb = new THREE.AmbientLight(0x33354C, 0.6); scene.add(amb);
const keyL = new THREE.DirectionalLight(0xF4F4F1, 0.0); keyL.position.set(-20, 30, 40); scene.add(keyL);
const cyanL = new THREE.PointLight(0x00DEE6, 0, 0, 1.4); scene.add(cyanL);
const magL = new THREE.PointLight(0xF54BF7, 0, 0, 1.4); scene.add(magL);
const rimL = new THREE.DirectionalLight(0x00DEE6, 0); rimL.position.set(30, 10, -30); scene.add(rimL);

const box = new THREE.BoxGeometry(1, 1, 1);
const matW = new THREE.MeshStandardMaterial({ color: 0xF4F4F1, roughness: .55, metalness: .05 });
const matD = new THREE.MeshStandardMaterial({ color: 0x33354C, roughness: .7 });
const matM = new THREE.MeshStandardMaterial({ color: 0xF54BF7, emissive: 0xF54BF7, emissiveIntensity: .9, roughness: .4 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x15161C, roughness: .8 });

// X gate: one InstancedMesh per colour
function makeX(depth) {
  const g = new THREE.Group();
  const byCh = { W: [], D: [], M: [] };
  CELLS.forEach(o => byCh[o.ch].push(o));
  const meshes = {};
  for (const ch of ['W', 'D', 'M']) {
    const list = byCh[ch];
    const m = new THREE.InstancedMesh(box, ch === 'W' ? matW : ch === 'D' ? matD : matM, list.length * depth);
    m.userData.list = list; m.userData.depth = depth;
    g.add(m); meshes[ch] = m;
  }
  g.userData.meshes = meshes;
  return g;
}
const dummy = new THREE.Object3D();
// place X cells; offFn(o, k) -> {x,y,z,s} extra offsets
function layoutX(g, offFn) {
  for (const ch of ['W', 'D', 'M']) {
    const m = g.userData.meshes[ch]; const d = m.userData.depth; let i = 0;
    for (const o of m.userData.list) for (let k = 0; k < d; k++) {
      const off = offFn ? offFn(o, k) : null;
      dummy.position.set(o.c - 7 + (off ? off.x : 0), 7 - o.r + (off ? off.y : 0), -k + (off ? off.z : 0));
      const s = off && off.s !== undefined ? off.s : 1;
      dummy.scale.set(s, s, s);
      dummy.rotation.set(off && off.rx || 0, off && off.ry || 0, 0);
      dummy.updateMatrix(); m.setMatrixAt(i++, dummy.matrix);
    }
    m.instanceMatrix.needsUpdate = true;
  }
}
const gate = makeX(3); scene.add(gate);           // monumental gate (S1, S2)
const logoX = makeX(1); scene.add(logoX);         // logo assembly (S5)

// grid floor
const grid = new THREE.GridHelper(400, 200, 0x00DEE6, 0x00DEE6);
grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);

// voxel player silhouette
const player = new THREE.Group();
[[0, 5.2, 0, 1.2, 1.2, 1.2], [0, 3.6, 0, 1.6, 2, .9], [-1.1, 3.7, 0, .5, 1.8, .5], [1.1, 3.7, 0, .5, 1.8, .5], [-.45, 1.3, 0, .6, 2.6, .6], [.45, 1.3, 0, .6, 2.6, .6]]
  .forEach(([x, y, z, sx, sy, sz]) => { const m = new THREE.Mesh(box, matDark); m.position.set(x, y, z); m.scale.set(sx, sy, sz); player.add(m); });
scene.add(player);

// floating dust cubes / tunnel cubes (one big instanced pool)
const POOL = 1400;
const poolMats = [matDark, matW, new THREE.MeshStandardMaterial({ color: 0x00DEE6, emissive: 0x00DEE6, emissiveIntensity: .8 }), matM];
const pools = poolMats.map(mt => { const m = new THREE.InstancedMesh(box, mt, POOL); scene.add(m); return m; });
const R = rng(7);
const pts = Array.from({ length: POOL * 4 }, (_, i) => ({ a: R(), b: R(), c: R(), d: R(), e: R(), k: i % 4 }));
const core = new THREE.Mesh(box, matM); scene.add(core);

function hidePools() { pools.forEach(p => { p.count = 0; }); }
function setPool(fn) {
  const counts = [0, 0, 0, 0];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i]; const r = fn(p, i); if (!r) continue;
    const m = pools[r.k ?? p.k]; const n = counts[r.k ?? p.k]; if (n >= POOL) continue;
    dummy.position.set(r.x, r.y, r.z); dummy.rotation.set(r.rx || 0, r.ry || 0, r.rz || 0); dummy.scale.setScalar(r.s);
    dummy.updateMatrix(); m.setMatrixAt(n, dummy.matrix); counts[r.k ?? p.k]++;
  }
  pools.forEach((m, i) => { m.count = counts[i]; m.instanceMatrix.needsUpdate = true; });
}

// ---------- 2D overlay ----------
const ov = document.getElementById('ov'); const g2 = ov.getContext('2d');
const loadImg = s => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(new Error('image failed: ' + s)); i.src = s; });
let IMG = {};
const WORLDS = [
  { img: 'curse-of-os-world.jpg', name: 'لعنة أوس', font: '400 150px Blaka', tag: 'HORROR · HYBRID', accent: '#A3121F', fg: '#E9DFCF' },
  { img: 'choice-room-world.jpg', name: 'غرفة الاختيار', font: '800 130px Changa', tag: 'CHOICES · TEAMS', accent: '#E5283A', fg: '#EDECE8' },
  { img: 'last-standing-world.jpg', name: 'آخر من يصمد', font: '800 130px Changa', tag: 'LAST STANDING', accent: '#FFC400', fg: '#F2EDE4' },
  { img: 'asia-journey-world.jpg', name: 'مشوار آسيا', font: '700 130px Marhey', tag: 'FOOTBALL QUEST', accent: '#F5C542', fg: '#FFFFFF' },
];
// noise tiles for grain
const noise = [];
for (let n = 0; n < 6; n++) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const d = x.createImageData(256, 256); const r = rng(100 + n);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); noise.push(c);
}

// pixel X drawn from the grid — exact symbol, crisp
function drawSymbol(cx, cy, size, alpha = 1, cellsUntil = 1) {
  const s = size / 15; g2.save(); g2.globalAlpha = alpha; g2.imageSmoothingEnabled = false;
  const x0 = Math.round(cx - size / 2), y0 = Math.round(cy - size / 2);
  CELLS.forEach((o, i) => {
    if (i / CELLS.length > cellsUntil) return;
    g2.fillStyle = o.ch === 'W' ? C.bone : o.ch === 'D' ? C.shade : C.mag;
    g2.fillRect(x0 + Math.floor(o.c * s), y0 + Math.floor(o.r * s), Math.ceil(s), Math.ceil(s));
  });
  g2.restore();
}
// X-shaped mask path at scale (for iris wipes)
function xPath(cx, cy, size) {
  const s = size / 15; g2.beginPath();
  CELLS.forEach(o => g2.rect(cx - size / 2 + o.c * s - .5, cy - size / 2 + o.r * s - .5, s + 1, s + 1));
}
function cover(img, zoom, panX, panY) {
  const sc = Math.max(W / img.width, H / img.height) * zoom;
  const w = img.width * sc, h = img.height * sc;
  g2.drawImage(img, (W - w) / 2 + panX, (H - h) / 2 + panY, w, h);
}
function text(str, x, y, font, color, align = 'center', alpha = 1, spacing = 0) {
  g2.save(); g2.globalAlpha = alpha; g2.font = font; g2.fillStyle = color; g2.textAlign = align; g2.textBaseline = 'middle';
  if (spacing) g2.letterSpacing = spacing + 'px';
  g2.fillText(str, x, y); g2.restore();
}
function revealText(str, x, y, font, color, p, dir = 'rtl') { // wipe reveal, RTL for Arabic
  g2.save(); g2.font = font; const w = g2.measureText(str).width + 40;
  const left = x - w / 2; g2.beginPath();
  if (dir === 'rtl') g2.rect(left + w * (1 - p), y - 200, w * p, 400); else g2.rect(left, y - 200, w * p, 400);
  g2.clip(); text(str, x, y, font, color); g2.restore();
}

// ---------- scene states ----------
function S1(t) { // SIGNAL 0–5
  const p = t / 5;
  scene.fog.density = 0.011;
  gate.visible = true; logoX.visible = false; player.visible = false; grid.visible = false; core.visible = false;
  gate.scale.setScalar(3.2); gate.position.set(0, 24, -40);
  layoutX(gate, null);
  camera.fov = 40; camera.position.set(lerp(-6, -2, p), lerp(2, 3.5, p), lerp(30, 14, eio(p)));
  camera.lookAt(0, lerp(10, 22, eio(p)), -40);
  // cyan pulses at 1.2, 2.4, 3.6
  let pulse = 0; [1.2, 2.4, 3.6].forEach((k, i) => { const d = t - k; if (d > 0) pulse = Math.max(pulse, Math.exp(-d * 2.6) * (0.6 + i * .25)); });
  amb.intensity = .02 + p * .05;
  keyL.position.set(-20, 30, 40); keyL.intensity = .03 + pulse * .8; rimL.position.set(30, 10, -30); rimL.intensity = .15 + pulse * 6;
  cyanL.distance = 0; cyanL.position.set(0, 18, -18); cyanL.intensity = pulse * 16000; magL.intensity = 0;
  setPool((q, i) => { if (q.k !== 0 && q.k !== 2) return null; if (i % 3) return null;
    return { x: (q.a - .5) * 120, y: q.b * 60 + Math.sin(t * .4 + q.e * 6) * 1.5, z: Math.min(-2, -q.c * 120 + 20 + t * .6), s: .12 + q.d * .35, rx: t * q.e, ry: t * q.d, k: q.k === 2 && q.e > .8 ? 2 : 0 }; });
}
function S2(t) { // AWAKENING 5–12
  gate.visible = true; logoX.visible = false; core.visible = false; scene.fog.density = 0.007;
  const shift = (o) => { // arms shift outward in pixel steps
    const ph = clamp((t - 8.6) / 2.6); const amt = Math.round(Math.sin(ph * Math.PI) * 2); // 0..2 steps
    if (o.q === 'm') return { x: 0, y: 0, z: 0 };
    return { x: (o.q[1] === 'l' ? -1 : 1) * amt * .5, y: (o.q[0] === 't' ? 1 : -1) * amt * .5, z: 0 };
  };
  if (t < T.gate) { // macro on cube edges, magenta sweep
    const p = prog(t, 5, T.gate);
    player.visible = false; grid.visible = false;
    gate.scale.setScalar(1); gate.position.set(0, 0, 0); layoutX(gate, null);
    camera.fov = 30; camera.position.set(lerp(-12, -7, eio(p)), lerp(-9, -6.5, p), lerp(10, 8, p));
    camera.lookAt(lerp(-5.5, -3.5, p), lerp(-5.5, -3.5, p), -1);
    amb.intensity = .25; keyL.intensity = .7; keyL.position.set(-20, 30, 40); rimL.intensity = .5;
    magL.distance = 9; magL.position.set(lerp(-12, 2, eio(p)), lerp(-8, -2, eio(p)), 2.5); magL.intensity = 80;
    cyanL.intensity = 0; hidePools();
  } else { // wide: monumental X gate, cyan grid, player silhouette backlit
    const p = prog(t, T.gate, 12);
    player.visible = true; grid.visible = true;
    gate.scale.setScalar(2.2); gate.position.set(0, 17, -30); layoutX(gate, shift);
    player.position.set(0, 0, 12); player.scale.setScalar(1.15);
    camera.fov = 46; camera.position.set(lerp(3, -2, p), lerp(3, 4, p), lerp(40, 32, eio(p)));
    camera.lookAt(0, lerp(13, 15, p), -20);
    grid.position.set(0, 0, 0);
    amb.intensity = .35; keyL.intensity = 1.3; keyL.position.set(-20, 30, 40); rimL.intensity = 1.8;
    magL.distance = 16; magL.position.set(0, 6, 7); magL.intensity = 900;
    cyanL.distance = 0; cyanL.position.set(0, 2, 26); cyanL.intensity = 60;
    setPool((q, i) => { if (i % 5 || q.k === 3) return null;
      return { x: (q.a - .5) * 90, y: q.b * 40 + 1, z: -q.c * 90 + 10, s: .1 + q.d * .25, rx: t * q.e, ry: t * .7, k: q.k === 2 ? 2 : 0 }; });
  }
}
function S4(t) { // CLIMAX 22–32
  gate.visible = false; logoX.visible = false; player.visible = false; grid.visible = false;
  scene.fog.density = 0.012; amb.intensity = .25; keyL.intensity = .3; rimL.intensity = .4;
  cyanL.position.set(0, 0, -10); magL.position.set(0, 0, -30);
  core.visible = false;
  if (t < T.vortex) { // pixel cube tunnel, accelerating
    const p = prog(t, T.s4, T.vortex); const speed = 40 + 160 * ei(p);
    const travel = 40 * (t - T.s4) + 80 * Math.pow(t - T.s4, 2) / 5;
    camera.fov = 55; camera.position.set(0, 0, 0); camera.lookAt(0, 0, -100);
    camera.rotation.z = 0; // no roll — the brand never rotates in-plane
    cyanL.distance = 0; magL.distance = 0; cyanL.intensity = 900; magL.intensity = 1800;
    setPool((q) => {
      const ring = Math.floor(q.a * 70); const z = ((-ring * 6 + travel) % 420) - 0; const zz = z > 10 ? z - 420 : z;
      const side = Math.floor(q.b * 4); const along = (q.c - .5) * 14;
      const sq = 7 + q.d * 1.5; // square tunnel (D-pad corridor)
      const x = side === 0 ? -sq : side === 1 ? sq : along; const y = side === 2 ? -sq : side === 3 ? sq : along;
      return { x: Math.round(x), y: Math.round(y), z: zz, s: .6 + q.e * .7, k: q.e > .93 ? 3 : q.e > .85 ? 2 : q.e > .55 ? 1 : 0 };
    });
  } else if (t < T.flash) { // vortex orbit → collapse to one magenta cube
    const p = prog(t, T.vortex, T.collapse); const c = prog(t, T.collapse, T.flash - .15);
    const ang = (t - T.vortex) * (1.2 + 3 * p);
    camera.fov = 45; const cd = lerp(95, 62, eio(p));
    camera.position.set(Math.sin(ang * .35) * cd, lerp(30, 10, p), Math.cos(ang * .35) * cd); camera.lookAt(0, 0, 0);
    cyanL.distance = 0; cyanL.position.set(0, 25, 0); cyanL.intensity = 2600; magL.distance = 0; magL.position.set(0, 0, 0); magL.intensity = 600 + 6000 * c;
    const shrink = Math.pow(1 - c, 2);
    setPool((q, i) => { if (i % 3) return null;
      const r0 = (5 + q.a * 30) * shrink; const th = q.b * Math.PI * 2 + ang * (1.5 - q.a * .8) * (1 + 2 * c);
      return { x: Math.cos(th) * r0, y: (q.c - .5) * 14 * shrink + Math.sin(th * 2 + q.d) * 1.2 * shrink, z: Math.sin(th) * r0, s: (.5 + q.d * .9) * Math.max(.05, shrink), rx: ang * q.e, ry: ang, k: q.e > .9 ? 3 : q.e > .78 ? 2 : q.e > .45 ? 1 : 0 };
    });
    core.visible = c > 0; core.position.set(0, 0, 0); core.scale.setScalar(.5 + 2.2 * eo(c)); core.rotation.set(0, 0, 0);
  } else { hidePools(); core.visible = false; }
}
function S5(t) { // LOGO 32–38 (3D part)
  gate.visible = false; player.visible = false; grid.visible = false; core.visible = false; hidePools();
  logoX.visible = t >= T.build; scene.fog.density = 0.004;
  amb.intensity = 1.1; keyL.intensity = 2.6; keyL.position.set(-10, 14, 30); rimL.intensity = 1.6; rimL.position.set(25, 8, -20);
  magL.distance = 0; magL.intensity = 0; cyanL.distance = 0; cyanL.position.set(16, 2, -8); cyanL.intensity = 700;
  const p = prog(t, T.build, T.front);
  layoutX(logoX, (o) => {
    const h = hash(o.r * 15 + o.c); const start = T.build + h * 1.0 + (o.q === 'm' ? .8 : 0); // centre plus lands last
    const k = stepq(eo(prog(t, start, start + .7)), 6); // stepped flight
    const sx = (hash(o.c * 31 + o.r) - .5) * 60, sy = (hash(o.r * 7 + o.c * 3) - .5) * 40, sz = -20 - hash(o.c + o.r * 99) * 60;
    return { x: sx * (1 - k), y: sy * (1 - k), z: sz * (1 - k), s: k > 0 ? 1 : 0.0001 };
  });
  logoX.position.set(0, 0, 0); logoX.scale.setScalar(1);
  // orbit settles front-on (yaw only, never in-plane roll)
  const fov = 30; const size = 430; const d = 15 * H / (2 * size * Math.tan(fov * Math.PI / 360));
  const yaw = lerp(.75, 0, eio(p)); const dist = lerp(d * 1.35, d, eio(p));
  camera.fov = fov; camera.position.set(Math.sin(yaw) * dist, lerp(6, 0, eio(p)), Math.cos(yaw) * dist + .5);
  camera.lookAt(0, 0, 0); camera.up.set(0, 1, 0);
}

// ---------- main render ----------
function render3D(t) {
  camera.up.set(0, 1, 0);
  if (t < T.s2) S1(t); else if (t < T.s3) S2(t); else if (t < T.s4) { // worlds are 2D; keep GL black
    gate.visible = logoX.visible = player.visible = grid.visible = core.visible = false; hidePools();
  } else if (t < T.s5) S4(t); else if (t < T.s6) S5(t); else { gate.visible = logoX.visible = player.visible = grid.visible = core.visible = false; hidePools(); }
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}

function letterbox(t) {
  // 2.39:1 bars for S1–S4, open at the logo
  let bar = 138;
  if (t >= T.s5) bar = 138 * (1 - eio(prog(t, T.build, T.front)));
  if (t >= T.s6) bar = 0;
  if (bar > .5) { g2.fillStyle = '#000'; g2.fillRect(0, 0, W, bar); g2.fillRect(0, H - bar, W, bar); }
  return bar;
}
function hud(t, bar) {
  if (bar < 60) return;
  const seq = t < T.s2 ? ['01', 'SIGNAL'] : t < T.s3 ? ['02', 'AWAKENING'] : t < T.s4 ? ['03', 'WORLDS'] : ['04', 'CLIMAX'];
  const a = .55 * clamp(t / 1.5);
  text(`${seq[0]} — ${seq[1]}`, 96, bar / 2, '400 22px SpaceMono', C.bone, 'left', a, 3);
  const f = Math.floor(t * 24); const tc = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % 24).padStart(2, '0')}`;
  text(tc, W - 96, bar / 2, '400 22px SpaceMono', C.bone, 'right', a, 3);
  // magenta player square in the bottom bar — the brand's "you"
  g2.fillStyle = C.mag; g2.globalAlpha = a; g2.fillRect(W / 2 - 7, H - bar / 2 - 7, 14, 14); g2.globalAlpha = 1;
}
function glitch(t, cuts) { // pixel slice displacement for a few frames after a cut
  for (const c of cuts) { const d = t - c; if (d >= 0 && d < .17) {
    const r = rng(Math.floor(t * 24) * 13 + 5); const img = g2.getImageData(0, 0, W, H); const n = 7;
    for (let k = 0; k < n; k++) { const y = Math.floor(r() * H); const h = 8 + Math.floor(r() * 60); const dx = Math.floor((r() - .5) * 120);
      g2.putImageData(img, dx, 0, 0, y, W, h); }
    if (r() > .4) { g2.fillStyle = r() > .5 ? C.cyan : C.mag; g2.globalAlpha = .9; g2.fillRect(Math.floor(r() * W), Math.floor(r() * H), 40 + r() * 200, 6); g2.globalAlpha = 1; }
  } }
}
function worlds(t) {
  const idx = Math.min(3, Math.floor((t - T.s3) / 2.5)); const local = t - T.worlds[idx];
  const drawW = (i, lt) => {
    const w = WORLDS[i]; const p = clamp(lt / 2.5);
    const dir = i % 2 ? -1 : 1;
    cover(IMG[w.img], 1.08 + .07 * p, dir * lerp(-30, 30, p), lerp(10, -10, p));
    // world tint & accent light bar
    const gr = g2.createLinearGradient(0, H, 0, H * .35); gr.addColorStop(0, 'rgba(11,11,15,.92)'); gr.addColorStop(1, 'rgba(11,11,15,0)');
    g2.fillStyle = gr; g2.fillRect(0, 0, W, H);
    g2.fillStyle = w.accent; g2.globalAlpha = .9; g2.fillRect(W - 96 - 220 * eo(clamp(lt / .6)), H - 300, 220 * eo(clamp(lt / .6)), 6); g2.globalAlpha = 1;
    revealText(w.name, W - 96 - 330, H - 400, w.font, w.fg, eo(clamp((lt - .15) / .7)), 'rtl');
    text(w.tag, W - 96, H - 250, '700 26px SpaceMono', w.fg, 'right', clamp((lt - .5) / .4) * .8, 6);
    text(`0${i + 1} / 04`, 96, H - 250, '700 26px Handjet', w.accent, 'left', clamp((lt - .5) / .4), 4);
  };
  // X iris: incoming world grows out of an X from the centre
  const ir = .55;
  if (idx > 0 && local < ir) {
    drawW(idx - 1, 2.5 + local);
    const p = ei(local / ir); const size = 40 * Math.pow(140, p);
    g2.save(); xPath(W / 2, H / 2, size); g2.clip(); drawW(idx, local); g2.restore();
  } else if (idx === 0 && local < ir) {
    g2.fillStyle = C.void; g2.fillRect(0, 0, W, H);
    const p = ei(local / ir); const size = 40 * Math.pow(140, p);
    g2.save(); xPath(W / 2, H / 2, size); g2.clip(); drawW(0, local); g2.restore();
  } else drawW(idx, local);
  // fade to black at end of S3
  const out = prog(t, T.s4 - .35, T.s4); if (out > 0) { g2.fillStyle = `rgba(0,0,0,${out})`; g2.fillRect(0, 0, W, H); }
}
function drawWordmark(cx, cy, width, reveal = 1, alpha = 1) {
  const img = IMG['usersx-wordmark.png']; const h = width * img.height / img.width;
  g2.save(); g2.globalAlpha = alpha; g2.beginPath(); g2.rect(cx - width / 2 + width * (1 - reveal), cy - h / 2 - 4, width * reveal + 8, h + 8); g2.clip();
  g2.drawImage(img, cx - width / 2, cy - h / 2, width, h); g2.restore();
}

function render2D(t) {
  g2.clearRect(0, 0, W, H);
  if (t >= T.s3 && t < T.s4) worlds(t);
  // S1 title-card text: tiny signal line
  if (t < T.s2) {
    const a = prog(t, .3, .9) * (1 - prog(t, 4.3, 5));
    const w = 520 * eo(prog(t, .3, 1.1)); g2.fillStyle = C.cyan; g2.globalAlpha = a * .9; g2.fillRect(W / 2 - w / 2, H / 2 + 300, w, 2); g2.globalAlpha = 1;
    text('INCOMING SIGNAL', W / 2, H / 2 + 330, '400 20px SpaceMono', C.cyan, 'center', a * .8, 8);
  }
  // S4 flash
  if (t >= T.flash && t < T.s5) { const f = 1 - prog(t, T.flash, T.flash + .3); g2.fillStyle = `rgba(244,244,241,${f})`; g2.fillRect(0, 0, W, H); }
  // S5: crossfade 3D voxel X → official flat symbol, then wordmark reveal RTL
  if (t >= T.s5 && t < T.s6) {
    const fl = prog(t, T.flat, T.flat + .5);
    const symCy = lerp(H / 2, H / 2 - 150, eio(prog(t, T.word, T.word + .7)));
    if (fl > 0) { g2.fillStyle = `rgba(11,11,15,${fl})`; g2.fillRect(0, 0, W, H); drawSymbol(W / 2, symCy, 430 * lerp(1, .62, eio(prog(t, T.word, T.word + .7))), fl); }
    const wr = eo(prog(t, T.word + .5, T.word + 1.4));
    if (wr > 0) drawWordmark(W / 2, H / 2 + 200, 760, wr, 1);
    if (t > T.s6 - .4) { g2.fillStyle = `rgba(11,11,15,${prog(t, T.s6 - .4, T.s6)})`; g2.fillRect(0, 0, W, H); }
  }
  // S6: final message
  if (t >= T.s6) {
    g2.fillStyle = C.void; g2.fillRect(0, 0, W, H);
    if (t < T.line2) {
      const a = prog(t, T.s6, T.s6 + .3) * (1 - prog(t, T.line2 - .3, T.line2));
      revealText('اللعبة بدأت.', W / 2, H / 2 - 60, '800 150px Kufam', C.bone, eo(prog(t, T.s6 + .1, T.s6 + .8)), 'rtl');
      text('THE GAME HAS STARTED.', W / 2, H / 2 + 110, '700 40px SpaceMono', C.bone, 'center', a * clamp((t - T.s6 - .6) / .4) * .85, 10);
    } else if (t < T.lock) {
      const a = 1 - prog(t, T.lock - .3, T.lock);
      g2.save(); g2.globalAlpha = a;
      revealText('قرارك.', W / 2, H / 2 - 60, '800 190px Kufam', C.mag, eo(prog(t, T.line2 + .05, T.line2 + .55)), 'rtl');
      text('YOUR CHOICE.', W / 2, H / 2 + 120, '700 44px SpaceMono', C.mag, 'center', clamp((t - T.line2 - .5) / .4), 12);
      g2.restore();
    } else {
      const a = prog(t, T.lock, T.lock + .5) * (1 - prog(t, T.end - .9, T.end - .05));
      drawSymbol(W / 2, H / 2 - 150, 260, a);
      drawWordmark(W / 2, H / 2 + 150, 680, 1, a);
    }
  }
  const bar = letterbox(t); hud(t, bar);
  glitch(t, [T.s2, T.gate, ...T.worlds.slice(1), T.s4, T.vortex]);
  // vignette + grain
  const vg = g2.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  g2.fillStyle = vg; g2.fillRect(0, 0, W, H);
  const f = Math.floor(t * 24); g2.save(); g2.globalAlpha = .055; g2.globalCompositeOperation = 'overlay';
  const pat = g2.createPattern(noise[f % 6], 'repeat'); g2.translate((f * 37) % 256, (f * 91) % 256); g2.fillStyle = pat; g2.fillRect(-256, -256, W + 512, H + 512); g2.restore();
  // fade in from black at start
  if (t < .5) { g2.fillStyle = `rgba(0,0,0,${1 - t / .5})`; g2.fillRect(0, 0, W, H); }
  if (t >= T.s5 && t < T.build) { g2.fillStyle = '#000'; g2.fillRect(0, 0, W, H); } // silence beat
}

window.renderAt = (t) => { render3D(t); render2D(t); return true; };
(async () => {
  const names = ['usersx-wordmark.png', ...WORLDS.map(w => w.img)];
  const imgs = await Promise.all(names.map(n => loadImg((n.startsWith('usersx') ? '../assets/logo/' : '../assets/games/') + n)));
  names.forEach((n, i) => IMG[n] = imgs[i]);
  const fonts = ['800 100px Kufam', '400 20px SpaceMono', '700 20px SpaceMono', '400 100px Blaka', '800 100px Changa', '700 100px Marhey', '700 20px Handjet'];
  await Promise.all(fonts.map(f => document.fonts.load(f, 'ابجد ABC 0123')));
  await document.fonts.ready;
  window.renderAt(0); window.READY = true;
})();
</script>
</body>
</html>
