<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0F0C" />
  <title>ضماناتي | Damanaty</title>
  <meta name="description" content="ضماناتي — نظامك الذكي لإدارة ملكية المنتجات" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="appbar" class="appbar hidden">
    <div class="brand">
      <div class="brand-mark"></div>
      <div><div class="brand-name">ضماناتي</div><div class="brand-sub">DAMANATY</div></div>
    </div>
    <nav>
      <button data-screen="screen-home" class="active" onclick="DamanatyApp.nav('screen-home')">الرئيسية</button>
      <button data-screen="screen-notifications" onclick="DamanatyApp.nav('screen-notifications')">الإشعارات</button>
      <button data-screen="screen-roadmap" onclick="DamanatyApp.nav('screen-roadmap')">المستقبل</button>
    </nav>
  </div>

  <div id="screen-onboarding" class="screen"></div>

  <div id="screen-home" class="screen hidden">
    <div class="container"></div>
    <button class="fab" onclick="DamanatyApp.openAddProduct()" aria-label="إضافة منتج">+</button>
  </div>

  <div id="screen-product" class="screen hidden">
    <div class="container"></div>
  </div>

  <div id="screen-passport" class="screen hidden">
    <div class="container"></div>
  </div>

  <div id="screen-roadmap" class="screen hidden">
    <div class="container"></div>
  </div>

  <div id="screen-notifications" class="screen hidden">
    <div class="container"></div>
  </div>

  <div id="modalHost" class="hidden"></div>
  <div id="toastWrap" class="toast-wrap"></div>

  <script src="js/data.js"></script>
  <script src="js/intelligence.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
