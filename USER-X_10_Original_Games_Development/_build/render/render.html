<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#16161C;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#16161C');
scene.add(new THREE.HemisphereLight(0xffffff, 0x30303a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 40 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffe9c7, 0.6); fill.position.set(-8, 6, -6); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#121217', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.012; ground.receiveShadow = true; scene.add(ground);

window.renderView = async (url, view, opts = {}) => {
  for (const o of [...scene.children]) if (o.userData.model) scene.remove(o);
  const gltf = await new GLTFLoader().loadAsync(url);
  const root = gltf.scene; root.userData.model = true;
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true;
    const m = o.material; if (m && m.transparent) { m.depthWrite = false; m.roughness = 0.05; m.metalness = 0; } } });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.z, size.y * 1.6);
  const aspect = W / H;
  let cam;
  const ortho = (hw) => { const hh = hw / aspect; const oc = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.01, 200); return oc; };
  if (view === 'top') { cam = ortho(Math.max(size.x / 2, size.z / 2 * aspect) * 1.08); cam.position.set(c.x, 50, c.z); cam.up.set(0, 0, -1); cam.lookAt(c.x, 0, c.z); }
  else if (view === 'front') { cam = ortho(Math.max(size.x / 2, size.y * aspect) * 1.1); cam.position.set(c.x, size.y / 2, 50); cam.lookAt(c.x, size.y / 2, 0); }
  else if (view === 'side') { cam = ortho(Math.max(size.z / 2, size.y * aspect) * 1.1); cam.position.set(50, size.y / 2, c.z); cam.lookAt(0, size.y / 2, c.z); }
  else if (view === 'persp') { cam = new THREE.PerspectiveCamera(35, aspect, 0.05, 200); const r = span * 1.35; cam.position.set(c.x + r * 0.62, r * 0.62, c.z + r * 0.85); cam.lookAt(c.x, 0.3, c.z); }
  else if (view === 'player') { cam = new THREE.PerspectiveCamera(50, aspect, 0.05, 200); cam.position.set(c.x + size.x * 0.12, 1.62, c.z + size.z * 0.36); cam.lookAt(c.x, 0.6, c.z - size.z * 0.12);
    root.traverse(o => { if (o.isMesh && /(player|trader|pawn|finder|operator|auctioneer|banker|assistant)/.test(o.name)) { const p = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()); if (Math.hypot(p.x - cam.position.x, p.z - cam.position.z) < 0.9) o.visible = false; } }); }
  else if (view === 'detail') { cam = new THREE.PerspectiveCamera(30, aspect, 0.001, 50); const r = Math.max(size.x, size.y, size.z) * 2.4; cam.position.set(c.x + r * 0.7, c.y + r * 0.55, c.z + r * 0.9); cam.lookAt(c); sun.shadow.camera.updateProjectionMatrix(); }
  if (cam.isPerspectiveCamera) cam.updateProjectionMatrix(); else cam.updateProjectionMatrix();
  renderer.render(scene, cam);
  return true;
};
window.ready = true;
</script></body></html>
