/* Semantic aliases - light theme */
:root, [data-theme="light"] {
  --dm-bg: var(--dm-color-white);
  --dm-bg-subtle: var(--dm-color-paper);
  --dm-surface: var(--dm-color-white);
  --dm-text: var(--dm-color-ink);
  --dm-text-muted: var(--dm-color-stone);
  --dm-brand: var(--dm-color-green-600);
  --dm-brand-strong: var(--dm-color-green-700);
  --dm-on-brand: var(--dm-color-white);
  --dm-border: var(--dm-color-sand);
  --dm-focus: var(--dm-color-green-700);
}
[data-theme="dark"] {
  --dm-bg: var(--dm-color-night);
  --dm-bg-subtle: var(--dm-color-night-raised);
  --dm-surface: var(--dm-color-night-raised);
  --dm-text: #F2F1EE;
  --dm-text-muted: #A8A39A;
  --dm-brand: var(--dm-color-green-500);
  --dm-brand-strong: var(--dm-color-mint);
  --dm-on-brand: var(--dm-color-white);
  --dm-border: #2C3330;
  --dm-focus: var(--dm-color-mint);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Tajawal',sans-serif;color:var(--dm-color-ink);background:#fff;
  font-feature-settings:'kern' 1;text-rendering:geometricPrecision}
.en{font-family:'Tajawal',sans-serif;direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
html,body{width:420px;height:420px;overflow:hidden;background:#fff}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;direction:rtl}
.scr.dark{background:#141716;color:#F2F1EE}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 15px 'Tajawal';direction:ltr}
.sb .r{display:flex;gap:6px;align-items:center}
.sb i{display:inline-block;width:17px;height:10px;border-radius:2px;background:currentColor;opacity:.9}
.sb b{display:inline-block;width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.sb b:after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 'Tajawal';padding:6px 9px 5px;border-radius:999px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.wcard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #ECE8DF;border-radius:18px;padding:14px;position:relative;overflow:hidden}
.dark .wcard{background:#1F2422;border-color:#2C3330}
.wcard .th{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;background:#F0F7F5;color:#2F7D6B}
.dark .wcard .th{background:#26302C;color:#7FD1B9}
.wcard .th svg{width:26px;height:26px}
.wcard h4{font:700 15px/1.3 'Tajawal';margin-bottom:2px}
.wcard p{font:400 12px/1.4 'Tajawal';color:#6B675F}
.dark .wcard p{color:#A8A39A}
.wcard .bar{height:4px;border-radius:4px;background:#ECE8DF;margin-top:9px;overflow:hidden}
.dark .wcard .bar{background:#2C3330}
.wcard .bar span{display:block;height:100%;border-radius:4px}
.wcard .edge{position:absolute;right:0;top:14px;bottom:14px;width:3px;border-radius:3px 0 0 3px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:#fff;border-top:1px solid #ECE8DF;display:flex;justify-content:space-around;padding-top:10px}
.dark .tabbar{background:#1F2422;border-color:#2C3330}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px 'Tajawal';color:#6B675F;width:70px}
.dark .tab{color:#8C877E}
.tab svg{width:24px;height:24px}
.tab.on{color:#2F7D6B}
.dark .tab.on{color:#7FD1B9}
.fab{width:56px;height:56px;border-radius:18px;background:#2F7D6B;color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(47,125,107,.35)}
.fab svg{width:26px;height:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font:700 16px 'Tajawal';background:#2F7D6B;color:#fff}
.btn.ghost{background:transparent;color:#2F7D6B;border:1.5px solid #C3E0D9}
.input{height:56px;border-radius:16px;border:1.5px solid #ECE8DF;display:flex;align-items:center;padding:0 16px;gap:10px;font:500 16px 'Tajawal';color:#231F20;background:#F7F5F0}
.input.focus{border-color:#2F7D6B;background:#fff;box-shadow:0 0 0 4px #E2EFEC}
.h-title{font:800 28px/1.2 'Tajawal'}
.muted{color:#6B675F}
.dark .muted{color:#A8A39A}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:5px;background:#231F20;opacity:.9}
.dark .home-ind{background:#fff}
